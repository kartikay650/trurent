# Refresh listings daily by re-running the Reddit scraper. The scraper writes
# directly to Supabase, so Vercel doesn't need a redeploy; the next chat /
# page-load will see the new data via the Supabase client.
#
# We still commit listings.json + meta.json for transparency / version history,
# which triggers a Vercel redeploy as a bonus.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY            - Haiku 4.5 extraction
#   NEXT_PUBLIC_SUPABASE_URL     - https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    - admin key for write access

name: Refresh listings

on:
  # 03:00 IST every day = 21:30 UTC the previous day.
  schedule:
    - cron: "30 21 * * *"
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js v2.106+ initializes its realtime client at
          # construction time and that needs native WebSocket support, which
          # Node 20 lacks. 22 LTS ships with native WebSocket; Vercel runs 24
          # so staying on 22+ also matches prod parity.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run multi-source ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDDIT_USER_AGENT: "github-actions:TruRent:v2.0 (by /u/kartikay650)"
          MAX_AGE_DAYS: "120"
          # SOURCES=reddit,olx,telegram,twitter once each ships.
          SOURCES: "reddit"
        run: node scripts/ingest/index.mjs

      - name: Commit listings.json snapshot if changed
        # Source of truth is Supabase. We still commit a versioned listings.json
        # snapshot to git for transparency / rollback. Meta lives in Supabase.
        run: |
          git config user.name "TruRent auto-scraper"
          git config user.email "auto@trurent.local"
          git add public/data/listings.json
          if git diff --cached --quiet; then
            echo "Nothing changed. Skipping commit."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./public/data/listings.json').length)")
          git commit -m "Auto-refresh listings: ${COUNT} from Reddit"
          git push
