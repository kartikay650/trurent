# Refresh listings daily by re-running the Reddit scraper. The scraper writes
# directly to Supabase, so Vercel doesn't need a redeploy; the next chat /
# page-load will see the new data via the Supabase client.
#
# We still commit listings.json + meta.json for transparency / version history,
# which triggers a Vercel redeploy as a bonus.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY            - Haiku 4.5 extraction
#   NEXT_PUBLIC_SUPABASE_URL     - https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    - admin key for write access

name: Refresh listings

on:
  # 03:00 IST every day = 21:30 UTC the previous day.
  schedule:
    - cron: "30 21 * * *"
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

# Forces actions/checkout, actions/setup-node, etc. to run on Node 24 instead
# of their default Node 20 runtime. Silences the deprecation warning AND
# future-proofs us against GitHub's forced migration on June 2nd, 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match Vercel exactly (Vercel runs 24). Even with this pin, the
          # supabase-js init is now Node-version-agnostic — it falls back to
          # the `ws` package if globalThis.WebSocket isn't defined.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run multi-source ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Reddit OAuth (script-app password grant). Without these the
          # scraper falls back to unauthenticated .json which Reddit now
          # 403s for every IP we've tested, including residential.
          # Create the script app at https://www.reddit.com/prefs/apps
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: "github-actions:TruRent:v2.0 (by /u/kartikay650)"
          MAX_AGE_DAYS: "120"
          # SOURCES=reddit,olx,telegram,twitter once each ships.
          SOURCES: "reddit"
        run: node scripts/ingest/index.mjs

      - name: Commit listings.json snapshot if changed
        # Source of truth is Supabase. We still commit a versioned listings.json
        # snapshot to git for transparency / rollback. Meta lives in Supabase.
        run: |
          git config user.name "TruRent auto-scraper"
          git config user.email "auto@trurent.local"
          git add public/data/listings.json
          if git diff --cached --quiet; then
            echo "Nothing changed. Skipping commit."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./public/data/listings.json').length)")
          git commit -m "Auto-refresh listings: ${COUNT} from Reddit"
          git push
